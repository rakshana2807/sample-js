<button onclick="check()">Check</button>

<hr>

<!-- ADD -->

<button onclick="update()">ADD</button>
<h2 id="text"></h2>
<hr>

<!--INPUT -->

<input id="inp" onkeyup="up()">
<h3 id="h3"></h3>
<hr>
<!--NAME-->
<h2 id="name">Name</h2>
<button id="r" onclick="ups(event)">VS Code</button>
<button id="ra" onclick="ups(event)">Gemini AI</button>

<!-- DELETE-->

<input id="input">
<button class="btn" onclick="add(event)">Add</button>
<ul id="list">
    <li>hello
        <button onclick="deletelist(event)">Delete</button>
    </li>
</ul>

<script>
    var n1 = document.getElementById("num1")
    var n2 = document.getElementById("num2")
    var result = document.getElementById("result")
    function add() {
        var n11 = Number(n1.value)
        var n22 = Number(n2.value)
        total = n11 + n22
        result.textContent = total
    }
    function sub() {
        var n11 = Number(n1.value)
        var n22 = Number(n2.value)
        total = n11 - n22
        result.textContent = total
    }
    function mul() {
        var n11 = Number(n1.value)
        var n22 = Number(n2.value)
        total = n11 * n22
        result.textContent = total
    }
    function div() {
        var n11 = Number(n1.value)
        var n22 = Number(n2.value)
        total = n11 / n22
        result.textContent = total
    }
    //random number//
    var gnum = document.getElementById("gnum")
    var result1 = document.getElementById("result1")
    var rnum = Math.floor(Math.random() * 10) + 1
    var tscore = 10
    function check() {
        var enternum = gnum.value
        if (rnum == enternum) {
            result1.textContent = "Right"
            alert("You Won..!")
        }
        else {
            tscore = tscore - 1
            score.textContent = "Your score :" + tscore
            result1.textContent = "Wrong"

        }
    }
    //task//

    var text = document.getElementById("text")
    function update() {
        var res = document.createElement("h3")
        res.textContent = "hello"
        text.append(res)
    }

    //task//
    var inp = document.getElementById("inp")
    var h3 = document.getElementById("h3")
    function up() {
        h3.textContent = inp.value
    }
    //task//
    var name1 = document.getElementById("name")
    function ups(event) {
        name1.textContent = event.target.textContent
    }
    //task//
    function del() {
        event.target.remove()
    }
    ///task//
    var list = document.getElementById("list")
    var input = document.getElementById("input")
    function add() {
        listelement = document.createElement("li")
        listelement.innerHTML = input.value + "<button onclick='deletelist(event)'>Delete</button>"
        list.append(listelement)

    }
    function deletelist(event) {
        event.target.parentElement.remove()
    }
    
</script>
